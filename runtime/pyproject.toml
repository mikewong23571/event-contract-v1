[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "event-contract-runtime"
version = "0.1.0"
description = "Event Contract Trading System - Runtime Engine"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "websockets==12.0",
    "aiohttp==3.9.1",
    "asyncio-mqtt==0.16.1",
    "pandas==2.1.4",
    "numpy==1.25.2",
    "python-binance==1.0.19",
    "ccxt==4.1.64",
    "pydantic==2.5.2",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "redis==5.0.1",
    "asyncpg==0.29.0",
    "influxdb-client==1.38.0",
    "asyncio==3.4.3",
    "aiofiles==23.2.1",
    "aiodns==3.1.1",
    "structlog==23.2.0",
    "prometheus-client==0.19.0",
    "scipy==1.11.4",
    "python-dateutil==2.8.2",
    "pytz==2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-mock==3.12.0",
    "black==23.11.0",
    "flake8==6.1.0",
    "isort==5.12.0",
    "mypy==1.7.1",
]

[project.scripts]
runtime = "src.main:main"
signal-detector = "src.engines.signal_detector:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true