[settings]
# Global isort configuration for all Python components
profile = black
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# Import sections order
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER
known_first_party = src,backend,backtesting,runtime,notifications

# Skip directories
skip = 
    .git,
    __pycache__,
    .pytest_cache,
    .mypy_cache,
    .venv,
    venv,
    .tox,
    dist,
    build,
    migrations,
    data,
    results,
    logs,
    templates

# File extensions
known_django = django
known_first_party = src
force_single_line = false
atomic = true